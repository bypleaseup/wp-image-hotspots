name: Release
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    name: Build distributable zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify version coherence
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -E '^[[:space:]]*\*[[:space:]]+Version:' image-hotspots-tool.php | head -1 | awk '{print $NF}')
          STABLE=$(grep -E '^Stable tag:' readme.txt | awk '{print $NF}')
          CONST=$(grep -E "define\(\s*'WPHS_VERSION'" image-hotspots-tool.php | sed -E "s/.*'([^']+)'\s*\).*/\1/")
          [ "$TAG" = "$HEADER" ] && [ "$TAG" = "$STABLE" ] && [ "$TAG" = "$CONST" ] || { echo "::error::Version mismatch tag=$TAG header=$HEADER readme=$STABLE const=$CONST"; exit 1; }
      - run: bash bin/build-zip.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: build/image-hotspots-tool-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
